
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <p class="subtitulo">Gerenciamento de produtos</p>

        <h2>Adicionar Produto</h2>

        <form id="form-produto">

            <input
                type="text"
                id="nome"
                placeholder="Nome do produto"
                required
            >

            <input
                type="number"
                id="preco"
                placeholder="Preço"
                min="0"
                step="0.01"
                required
            >

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade"
                min="0"
                step="1"
                required
            >

            <button type="submit" id="botao-salvar">
                Cadastrar
            </button>

        </form>

        <h2>Pesquisar Produtos</h2>

        <div class="busca-container">

            <input
                type="text"
                id="campo-busca"
                placeholder="Digite o nome do objeto..."
                autocomplete="off"
            >

        </div>

        <div class="metricas-container">

            <p id="total-estoque">
                Total em Estoque: 0
            </p>

        </div>

        <h2>Lista de Produtos</h2>

        <div class="tabela-container">

            <table>

                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="lista-produtos">
                </tbody>

            </table>

        </div>

        <p id="mensagem-vazia" class="mensagem-vazia"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
